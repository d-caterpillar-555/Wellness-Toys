      - generic [ref=f3e110]:
        - heading "Most of this industry talks to you like a joke." [level=2] [ref=f3e111]
        - generic [ref=f3e112]:
          - paragraph [ref=f3e113]: Open a typical shop in this category and you get black backgrounds, neon glow, and product names that are embarrassed by their own subject. The information you actually need is buried under the winking.
          - paragraph [ref=f3e114]: So we started from the other direction. Everything we sell has a materials list, care instructions and dimensions. Everything we publish has a source. Where a question is medical, we say so and point you at a clinician instead of quietly implying a product will fix it.
          - paragraph [ref=f3e115]: That is the whole idea. Treat people as adults, and treat the subject the way any other part of health gets treated.
      - generic [ref=f3e118]:
        - generic [ref=f3e119]:
          - term [ref=f3e120]: We will not invent facts.
          - definition [ref=f3e121]: No made up statistics, no borrowed credentials, no studies that do not exist. If we cite something, you can follow the link and read it.
        - generic [ref=f3e122]:
          - term [ref=f3e123]: We will not make medical claims.
          - definition [ref=f3e124]: A product can be described accurately without pretending to be a treatment. Anything clinical belongs with a clinician.
        - generic [ref=f3e125]:
          - term [ref=f3e126]: We will not sell your privacy.
          - definition [ref=f3e127]: Purchase history and browsing in this category reveal health intent. No advertising trackers, no session recording, and nothing in a URL that identifies you.
        - generic [ref=f3e128]:
          - term [ref=f3e129]: We will not pretend to be discreet.
          - definition [ref=f3e130]: Plain packaging and a neutral billing descriptor, stated once, on the shipping page. It is a standard we meet, not a slogan we shout.
