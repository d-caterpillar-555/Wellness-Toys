      - generic [ref=e213]:
        - heading "Most of this industry talks to you like a joke." [level=2] [ref=e214]
        - generic [ref=e215]:
          - paragraph [ref=e216]: Open a typical shop in this category and you get black backgrounds, neon glow, and product names that are embarrassed by their own subject. The information you actually need is buried under the winking.
          - paragraph [ref=e217]: So we started from the other direction. Everything we sell has a materials list, care instructions and dimensions. Everything we publish has a source. Where a question is medical, we say so and point you at a clinician instead of quietly implying a product will fix it.
          - paragraph [ref=e218]: That is the whole idea. Treat people as adults, and treat the subject the way any other part of health gets treated.
      - generic [ref=e220]:
        - heading "Three things we will not do" [level=2] [ref=e221]
        - generic [ref=e222]:
          - generic [ref=e223]:
            - term [ref=e224]: We will not invent facts.
            - definition [ref=e225]: No made up statistics, no borrowed credentials, no studies that do not exist. If we cite something, you can follow the link and read it.
          - generic [ref=e226]:
            - term [ref=e227]: We will not make medical claims.
            - definition [ref=e228]: A product can be described accurately without pretending to be a treatment. Anything clinical belongs with a clinician.
          - generic [ref=e229]:
            - term [ref=e230]: We will not sell your privacy.
            - definition [ref=e231]: Purchase history and browsing in this category reveal health intent. No advertising trackers, no session recording, and nothing in a URL that identifies you.
          - generic [ref=e232]:
            - term [ref=e233]: We will not pretend to be discreet.
            - definition [ref=e234]: Plain packaging and a neutral billing descriptor, stated once, on the shipping page. It is a standard we meet, not a slogan we shout.
