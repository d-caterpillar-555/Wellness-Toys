      - generic [ref=f5e190]:
        - heading "Most of this industry talks to you like a joke." [level=2] [ref=f5e191]
        - generic [ref=f5e192]:
          - paragraph [ref=f5e193]: Open a typical shop in this category and you get black backgrounds, neon glow, and product names that are embarrassed by their own subject. The information you actually need is buried under the winking.
          - paragraph [ref=f5e194]: So we started from the other direction. Everything we sell has a materials list, care instructions and dimensions. Everything we publish has a source. Where a question is medical, we say so and point you at a clinician instead of quietly implying a product will fix it.
          - paragraph [ref=f5e195]: That is the whole idea. Treat people as adults, and treat the subject the way any other part of health gets treated.
      - generic [ref=f5e197]:
        - heading "Three things we will not do" [level=2] [ref=f5e198]
        - generic [ref=f5e199]:
          - generic [ref=f5e200]:
            - term [ref=f5e201]: We will not invent facts.
            - definition [ref=f5e202]: No made up statistics, no borrowed credentials, no studies that do not exist. If we cite something, you can follow the link and read it.
          - generic [ref=f5e203]:
            - term [ref=f5e204]: We will not make medical claims.
            - definition [ref=f5e205]: A product can be described accurately without pretending to be a treatment. Anything clinical belongs with a clinician.
          - generic [ref=f5e206]:
            - term [ref=f5e207]: We will not sell your privacy.
            - definition [ref=f5e208]: Purchase history and browsing in this category reveal health intent. No advertising trackers, no session recording, and nothing in a URL that identifies you.
          - generic [ref=f5e209]:
            - term [ref=f5e210]: We will not pretend to be discreet.
            - definition [ref=f5e211]: Plain packaging and a neutral billing descriptor, stated once, on the shipping page. It is a standard we meet, not a slogan we shout.
