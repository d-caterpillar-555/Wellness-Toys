name: wellness-toys

services:
  postgres:
    image: postgres:18-alpine
    container_name: wellness_toys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wellness_toys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellness_toys_dev}
      POSTGRES_DB: wellness_toys_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness_toys -d wellness_toys_development"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  meilisearch:
    # Pinned to the same minor as the project-local binary fetched by
    # script/fetch-meilisearch, so the two paths behave identically.
    image: getmeili/meilisearch:v1.53
    container_name: wellness_toys_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  meilisearch_data:
