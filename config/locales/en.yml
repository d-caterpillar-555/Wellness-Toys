# Application copy: every user-facing string that is not page content.
#
# Product names, article bodies and page copy live in the database. Interface
# strings live here, so each one has a single owner and a single place to
# change. Keys are namespaced by the surface that renders them.
#
# Copy rules for this store (docs/design/DESIGN.md): plain language, no claims,
# no euphemism, and hyphens rather than em-dashes.
