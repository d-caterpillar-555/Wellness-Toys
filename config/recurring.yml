# Recurring work, run by Solid Queue in production.
#
# Retention is a scheduled job rather than a manual chore because the rules it
# enforces are promises the privacy page makes, and a promise that depends on
# somebody remembering is not a control.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  data_retention:
    class: DataRetentionJob
    schedule: every day at 3am
